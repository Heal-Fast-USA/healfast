# HealFast USA Nginx - Subdomains clinic.healfastusa.org + staff.healfastusa.org
# SSL: certs at /etc/nginx/ssl (mount HEALFAST_BRANDING_PATH/ssl). /bahmni_config/ served from nginx for branding.

upstream bahmni_web {
    server bahmni-web:8091;
}

upstream bahmni_apps_frontend {
    server bahmni-apps-frontend:80;
}

upstream openmrs {
    server openmrs:8080;
}

# reports: use variable so nginx starts when reports container is down; try 8050 then 8080 (Tomcat default)
upstream implementer_interface {
    server implementer-interface:80;
}

# HTTP: serve ACME challenge for Let's Encrypt, then redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt / Certbot webroot (mount acme-webroot at /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - clinic.healfastusa.org (main EMR) - default for 443 so nginx always has a match
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name clinic.healfastusa.org;
    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/nginx/ssl/healfastusa.org.crt;
    ssl_certificate_key /etc/nginx/ssl/healfastusa.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self';" always;

    client_max_body_size 100M;

    location / {
        proxy_pass http://bahmni_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # Serve branding config from nginx so logo/CSS/whiteLabel apply
    location /bahmni_config/ {
        alias /usr/share/nginx/html/bahmni_config/;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
    }

    location /openmrs/ {
        proxy_pass http://openmrs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /bahmni-new/ {
        proxy_pass http://bahmni_apps_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bahmni Reports (port 8050; if 502 try changing to reports:8080)
    location /bahmni-reports/ {
        set $reports_backend reports:8050;
        proxy_pass http://$reports_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # Dashboard link uses /bahmni/reports/; rewrite to /bahmni-reports/ for backend
    location /bahmni/reports/ {
        set $reports_backend reports:8050;
        rewrite ^/bahmni/reports/(.*)$ /bahmni-reports/$1 break;
        proxy_pass http://$reports_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /implementer-interface/ {
        proxy_pass http://implementer_interface;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

