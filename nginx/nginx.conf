# HealFast USA Nginx Configuration for Bahmni
# Requires SSL certs at /etc/nginx/ssl/healfastusa.org.crt and .key (mounted from healfast-branding/ssl/)

upstream bahmni_web {
    server bahmni-web:80;
}

upstream bahmni_apps_frontend {
    server bahmni-apps-frontend:80;
}

upstream openmrs {
    server openmrs:8080;
}

upstream reports {
    server reports:8050;
}

upstream implementer_interface {
    server implementer-interface:80;
}

# Main clinic subdomain - clinic.healfastusa.org
server {
    listen 80;
    listen [::]:80;
    server_name clinic.healfastusa.org;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# Default HTTPS server (catches requests by IP or unknown Host)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name clinic.healfastusa.org _;

    # SSL Certificate Configuration
    ssl_certificate /etc/nginx/ssl/healfastusa.org.crt;
    ssl_certificate_key /etc/nginx/ssl/healfastusa.org.key;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/clinic_access.log;
    error_log /var/log/nginx/clinic_error.log;

    # Client body size
    client_max_body_size 100M;

    # Main Bahmni Web Application
    location / {
        proxy_pass http://bahmni_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Retry if backend not ready
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # Bahmni Config (for custom branding)
    location /bahmni_config/ {
        proxy_pass http://bahmni_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenMRS API
    location /openmrs/ {
        proxy_pass http://openmrs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Bahmni Apps Frontend (New UI)
    location /bahmni-new/ {
        proxy_pass http://bahmni_apps_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reports
    location /bahmni-reports/ {
        proxy_pass http://reports;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

