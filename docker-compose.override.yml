# HealFast USA Docker Compose Override
# This file extends the base docker-compose.yml to add branding and SSL support
# Requires HEALFAST_BRANDING_PATH in .env (absolute path to healfast-branding folder).
# Usage: docker compose -f docker-compose.yml -f ../healfast-branding/docker-compose.override.yml --env-file .env up -d
# (version is omitted; Compose v2+ ignores it)

services:
  # Override proxy service to use custom nginx with SSL and subdomain routing
  proxy:
    image: nginx:alpine
    volumes:
      # Mount custom nginx configuration (use HEALFAST_BRANDING_PATH so path is correct when run from bahmni-lite)
      - ${HEALFAST_BRANDING_PATH}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certificates
      - ${HEALFAST_BRANDING_PATH}/ssl:/etc/nginx/ssl:ro
      # Mount branding config so nginx can serve static assets if needed
      - ${HEALFAST_BRANDING_PATH}/config:/usr/share/nginx/html/bahmni_config:ro
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    depends_on:
      - bahmni-web
      - bahmni-apps-frontend
      - openmrs
    environment:
      TZ: ${TZ:-America/New_York}

  # Override bahmni-config: image's start.sh copies between /etc and /usr/local; they are the same inode in the image (symlink). Use TWO separate host dirs (config + config_etc) so the container sees two distinct paths.
  bahmni-config:
    volumes:
      - '${CONFIG_VOLUME:-./healfast-branding/config}:/usr/local/bahmni_config:ro'
      - '${CONFIG_VOLUME_ETC:-./healfast-branding/config_etc}:/etc/bahmni_config'

  # Ensure bahmni-web has access to branding config
  bahmni-web:
    volumes:
      - "${CONFIG_VOLUME:-./healfast-branding/config}:/usr/local/apache2/htdocs/bahmni_config/:ro"
