# HealFast USA Docker Compose Override
# This file extends the base docker-compose.yml to add branding and SSL support
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d

version: '3.7'

services:
  # Override proxy service to use custom nginx with SSL and subdomain routing
  proxy:
    image: nginx:alpine
    volumes:
      # Mount custom nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certificates
      - ./ssl:/etc/nginx/ssl:ro
      # Mount branding config so nginx can serve static assets if needed
      - ./config:/usr/share/nginx/html/bahmni_config:ro
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    depends_on:
      - bahmni-web
      - bahmni-apps-frontend
      - openmrs
    environment:
      TZ: ${TZ:-America/New_York}

  # Override bahmni-config to include HealFast branding
  bahmni-config:
    volumes:
      - '${CONFIG_VOLUME:-./healfast-branding/config}:/usr/local/bahmni_config'
      # Also mount to the standard location for compatibility
      - '${CONFIG_VOLUME:-./healfast-branding/config}:/etc/bahmni_config'

  # Ensure bahmni-web has access to branding config
  bahmni-web:
    volumes:
      - "${CONFIG_VOLUME:-./healfast-branding/config}:/usr/local/apache2/htdocs/bahmni_config/:ro"
